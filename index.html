<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه حضور و غیاب آنلاین</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- تقویم شمسی -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
    <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

    <style>
        body { font-family: Tahoma, sans-serif; margin: 0; padding: 20px; background-color: #eef2f5; color: #333; }
        .container { max-width: 550px; margin: 20px auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; position: relative; margin-bottom: 20px; }
        h2 { margin-top: 10px; color: #2c3e50; font-size: 20px; }
        
        .version-badge {
            display: inline-block;
            background-color: #e2e8f0;
            color: #475569;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 10px;
            direction: ltr;
        }

        .info-box { background-color: #e8f4fd; color: #1d6fce; padding: 12px 15px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; text-align: center; font-size: 14px; border-right: 4px solid #1d6fce; }
        input[type="text"], select { width: 100%; padding: 11px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: Tahoma; font-size: 14px; }
        
        .btn-attendance { background-color: #27ae60; color: white; border: none; padding: 14px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; }
        .btn-attendance:hover { background-color: #219150; }

        .btn-teacher { background-color: #2980b9; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; font-weight: bold; margin-top: 10px; }
        .btn-teacher:hover { background-color: #2471a3; }

        .btn-back { background-color: #7f8c8d; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; font-weight: bold; margin-bottom: 15px; }
        .btn-back:hover { background-color: #707b7c; }

        .status-message { margin-top: 20px; padding: 12px; border-radius: 8px; font-weight: bold; display: none; text-align: right; }
        .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .report-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; text-align: right; }
        .report-table th, .report-table td { border: 1px solid #ddd; padding: 8px; }
        .report-table th { background-color: #f2f2f2; color: #333; }
    </style>
</head>
<body>

    <div class="container">
        <!-- بخش دانش‌آموز -->
        <div id="student-view" class="card">
            <span id="version-display" class="version-badge">v2.1</span>
            <h2>📌 ثبت حضور و غیاب کلاس</h2>
            
            <div id="user-info" class="info-box">
                در حال دریافت اطلاعات کاربر ایتا...
            </div>

            <div style="text-align: right; margin-bottom: 10px;">
                <label for="course-select"><b>انتخاب درس:</b> <small style="color: red;">*</small></label>
                <select id="course-select">
                    <option value="">-- لطفاً درس را انتخاب کنید --</option>
                    <option value="فرهنگ و هنر">فرهنگ و هنر</option>
                    <option value="آموزش قرآن">آموزش قرآن</option>
                    <option value="پیام‌های آسمان">پیام‌های آسمان</option>
                    <option value="فارسی">فارسی</option>
                    <option value="نگارش (آموزش مهارت‌های نوشتاری)">نگارش (آموزش مهارت‌های نوشتاری)</option>
                    <option value="ریاضی">ریاضی</option>
                    <option value="علوم تجربی">علوم تجربی</option>
                    <option value="مطالعات اجتماعی">مطالعات اجتماعی</option>
                    <option value="تفکر و سبک زندگی">تفکر و سبک زندگی</option>
                    <option value="زبان انگلیسی">زبان انگلیسی</option>
                    <option value="زبان عربی">زبان عربی</option>
                    <option value="کار و فناوری">کار و فناوری</option>
                    <option value="تربیت بدنی و سلامت">تربیت بدنی و سلامت</option>
                </select>
            </div>

            <div style="text-align: right; margin-bottom: 15px;">
                <label for="custom-name"><b>نام و نام خانوادگی دانش‌آموز:</b> <small style="color: red;">*</small></label>
                <input type="text" id="custom-name" placeholder="مثلاً: علی محمدی">
            </div>

            <button id="attendance-btn" class="btn-attendance" onclick="registerAttendance()">
                ثبت حضور در کلاس
            </button>

            <button class="btn-teacher" onclick="switchToTeacherView()">
                🔐 ورود دبیر (پنل مدیریت)
            </button>

            <div id="status-box" class="status-message"></div>
        </div>

        <!-- بخش پنل دبیر -->
        <div id="teacher-view" class="card" style="display: none;">
            <h2>📊 پنل گزارش‌گیری دبیر</h2>
            
            <button class="btn-back" onclick="switchToStudentView()">
                🔙 بازگشت به صفحه دانش‌آموز
            </button>

            <div style="text-align: right; margin-bottom: 10px;">
                <label for="report-course"><b>انتخاب درس:</b></label>
                <select id="report-course">
                    <option value="">-- همه درس‌ها --</option>
                    <option value="فرهنگ و هنر">فرهنگ و هنر</option>
                    <option value="آموزش قرآن">آموزش قرآن</option>
                    <option value="پیام‌های آسمان">پیام‌های آسمان</option>
                    <option value="فارسی">فارسی</option>
                    <option value="نگارش (آموزش مهارت‌های نوشتاری)">نگارش (آموزش مهارت‌های نوشتاری)</option>
                    <option value="ریاضی">ریاضی</option>
                    <option value="علوم تجربی">علوم تجربی</option>
                    <option value="مطالعات اجتماعی">مطالعات اجتماعی</option>
                    <option value="تفکر و سبک زندگی">تفکر و سبک زندگی</option>
                    <option value="زبان انگلیسی">زبان انگلیسی</option>
                    <option value="زبان عربی">زبان عربی</option>
                    <option value="کار و فناوری">کار و فناوری</option>
                    <option value="تربیت بدنی و سلامت">تربیت بدنی و سلامت</option>
                </select>
            </div>

            <div style="text-align: right; margin-bottom: 15px;">
                <label for="report-date"><b>تاریخ (شمسی):</b></label>
                <input type="text" id="report-date" placeholder="برای انتخاب تقویم کلیک کنید...">
            </div>

            <button class="btn-attendance" style="background-color: #2980b9;" onclick="fetchAttendanceReport()">
                دریافت گزارش حضور و غیاب
            </button>

            <div id="report-result" style="margin-top: 20px; overflow-x: auto;"></div>
        </div>
    </div>

    <script>
        const APP_VERSION = "v2.1";
        document.getElementById('version-display').innerText = APP_VERSION;

        const SUPABASE_URL = 'https://cxnztsdhnndijpyscvvg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6df-9vl0Iraj7Ou0SgnV3g_1_xDneAm';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentEitaaUserId = null;
        let currentEitaaProfileName = '';

        // تبدیل اعداد انگلیسی به فارسی برای هماهنگی با دیتابیس
        function toPersianDigits(str) {
            if (!str) return '';
            return str.replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        $(document).ready(function() {
            $("#report-date").persianDatepicker({
                format: 'YYYY/MM/DD',
                initialValue: true,
                autoClose: true,
                toolbox: {
                    calendarSwitch: {
                        enabled: false
                    }
                }
            });
        });

        function initEitaaUser() {
            try {
                const wa = window.Eitaa && window.Eitaa.WebApp;
                if (wa && wa.initDataUnsafe && wa.initDataUnsafe.user) {
                    const user = wa.initDataUnsafe.user;
                    currentEitaaUserId = user.id;
                    currentEitaaProfileName = [user.first_name, user.last_name].filter(Boolean).join(" ");
                }
            } catch (e) {
                console.log("خطا در خواندن وب‌اپ ایتا:", e);
            }

            const infoBox = document.getElementById('user-info');
            if (currentEitaaUserId) {
                infoBox.innerHTML = `👤 کاربر ایتا: <b>${currentEitaaProfileName}</b> (آیدی: ${currentEitaaUserId})`;
            } else {
                infoBox.innerHTML = `لطفاً اطلاعات زیر را جهت ثبت حضور وارد کنید`;
            }
        }

        document.addEventListener('DOMContentLoaded', initEitaaUser);

        function getJalaliDate() {
            return new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Tehran' }).format(new Date());
        }

        function switchToTeacherView() {
            document.getElementById('student-view').style.display = 'none';
            document.getElementById('teacher-view').style.display = 'block';
        }

        function switchToStudentView() {
            document.getElementById('teacher-view').style.display = 'none';
            document.getElementById('student-view').style.display = 'block';
        }

        async function registerAttendance() {
            const btn = document.getElementById('attendance-btn');
            const nameInput = document.getElementById('custom-name');
            const courseSelect = document.getElementById('course-select');
            
            const customName = nameInput.value.trim();
            const selectedCourse = courseSelect.value;

            if (!selectedCourse) {
                alert("❌ لطفاً درس مورد نظر را انتخاب کنید!");
                return;
            }

            if (!customName) {
                alert("❌ لطفاً نام و نام خانوادگی خود را وارد کنید!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "در حال ثبت...";

            const jalaliDateStr = getJalaliDate();
            const today = new Date().toISOString().split('T')[0];
            const finalStudentId = currentEitaaUserId ? parseInt(currentEitaaUserId, 10) : Math.floor(Math.random() * 899999) + 100000;

            try {
                await supabaseClient.from('students').upsert({ 
                    id: finalStudentId, 
                    full_name: currentEitaaProfileName || customName
                });

                const { error } = await supabaseClient.from('attendance').insert([
                    { 
                        student_id: finalStudentId, 
                        status_date: today,
                        entered_name: customName,
                        subject: selectedCourse,
                        jalali_date: jalaliDateStr,
                        eitaa_user_id: currentEitaaUserId,
                        eitaa_profile_name: currentEitaaProfileName
                    }
                ]);

                if (error) {
                    showStatus("❌ خطا در ثبت حضور: " + error.message, "error");
                } else {
                    showStatus(`✅ حضور شما در درس <b>${selectedCourse}</b> ثبت شد!<br>👤 نام: ${customName}<br>📅 تاریخ: ${jalaliDateStr}`, "success");
                    nameInput.value = '';
                    courseSelect.value = '';
                }
            } catch (err) {
                showStatus("❌ خطای غیرمنتظره: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "ثبت حضور در کلاس (مجدد)";
            }
        }

        async function fetchAttendanceReport() {
            const course = document.getElementById('report-course').value;
            let rawDateStr = document.getElementById('report-date').value.trim();
            const resultDiv = document.getElementById('report-result');

            resultDiv.innerHTML = "در حال بارگذاری گزارش...";

            try {
                let query = supabaseClient.from('attendance').select('*').order('created_at', { ascending: false });

                if (course) {
                    query = query.eq('subject', course);
                }
                if (rawDateStr) {
                    // تبدیل تاریخ تقویم (اعداد انگلیسی) به فرمت دیتابیس (اعداد فارسی)
                    const persianDateStr = toPersianDigits(rawDateStr);
                    // جستجو به صورت انعطاف‌پذیر (هم دقیق و هم شامل)
                    query = query.or(`jalali_date.eq.${persianDateStr},jalali_date.ilike.%${rawDateStr}%`);
                }

                const { data, error } = await query;

                if (error) {
                    resultDiv.innerHTML = `<p style="color: red;">خطا در دریافت گزارش: ${error.message}</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    resultDiv.innerHTML = `<p style="color: #666; margin-top: 15px;">رکوردی برای این تاریخ و درس یافت نشد.</p>`;
                    return;
                }

                let html = `<p style="font-weight: bold; text-align: right;">تعداد موارد یافت شده: ${data.length}</p>`;
                html += `<table class="report-table">
                            <thead>
                               <tr>
                                   <th>ردیف</th>
                                   <th>نام دانش‌آموز</th>
                                   <th>درس</th>
                                   <th>تاریخ</th>
                                   <th>پروفایل ایتا</th>
                               </tr>
                            </thead>
                            <tbody>`;

                data.forEach((row, index) => {
                    html += `<tr>
                                <td>${index + 1}</td>
                                <td><b>${row.entered_name || 'نامشخص'}</b></td>
                                <td>${row.subject || '-'}</td>
                                <td>${row.jalali_date || '-'}</td>
                                <td>${row.eitaa_profile_name || 'ثبت نشده'}</td>
                             </tr>`;
                });

                html += `</tbody></table>`;
                resultDiv.innerHTML = html;

            } catch (err) {
                resultDiv.innerHTML = `<p style="color: red;">خطا: ${err.message}</p>`;
            }
        }

        function showStatus(message, type) {
            const statusBox = document.getElementById('status-box');
            statusBox.style.display = "block";
            statusBox.className = "status-message " + (type === "success" ? "status-success" : "status-error");
            statusBox.innerHTML = message;
        }
    </script>
</body>
</html>
