<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه حضور و غیاب آنلاین</title>
    <!-- بارگذاری فونت وزیرمتن -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- تقویم شمسی -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
    <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

    <style>
        body { 
            font-family: 'Vazirmatn', Tahoma, sans-serif; 
            margin: 0; 
            padding: 15px; 
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); 
            color: #243b53; 
            min-height: 100vh;
        }
        .container { max-width: 100%; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 25px rgba(16, 42, 67, 0.08); text-align: center; position: relative; margin-bottom: 20px; border-top: 5px solid #1d72b8; }
        h2 { margin-top: 10px; color: #102a43; font-size: 20px; }
        
        .version-badge {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            direction: ltr;
        }

        .info-box { background-color: #f0f9ff; color: #0369a1; padding: 12px 15px; border-radius: 10px; font-weight: bold; margin-bottom: 20px; text-align: center; font-size: 13px; border-right: 4px solid #0284c7; border-left: 1px solid #e0f2fe; border-top: 1px solid #e0f2fe; border-bottom: 1px solid #e0f2fe; }
        
        label { color: #334e68; font-weight: 500; font-size: 14px; }
        input[type="text"], select { width: 100%; padding: 12px; margin: 8px 0 16px 0; border: 1.5px solid #bcccdc; border-radius: 8px; box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 14px; background-color: #f8fafc; transition: all 0.3s ease; }
        input[type="text"]:focus, select:focus { border-color: #0284c7; outline: none; background-color: #fff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        
        /* دکمه اصلی ثبت (آبی مدرن سرزنده) */
        .btn-attendance { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-bottom: 10px; font-family: 'Vazirmatn', Tahoma, sans-serif; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); transition: all 0.2s ease; }
        .btn-attendance:hover { background: linear-gradient(135deg, #0369a1 0%, #075985 100%); transform: translateY(-1px); }

        /* دکمه ورود دبیر (آبی تیره رسمی) */
        .btn-teacher { background: linear-gradient(135deg, #334e68 0%, #243b53 100%); color: white; border: none; padding: 12px 15px; border-radius: 10px; cursor: pointer; width: 100%; font-size: 14px; font-weight: bold; margin-top: 10px; font-family: 'Vazirmatn', Tahoma, sans-serif; transition: all 0.2s ease; }
        .btn-teacher:hover { background: linear-gradient(135deg, #243b53 0%, #102a43 100%); }

        /* دکمه نمایش کل رکوردها (آبی کاربنی ملایم) */
        .btn-all { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; width: 100%; font-size: 15px; font-weight: bold; margin-top: 10px; font-family: 'Vazirmatn', Tahoma, sans-serif; transition: all 0.2s ease; }
        .btn-all:hover { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); }

        /* دکمه بازگشت */
        .btn-back { background-color: #627d98; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 14px; font-weight: bold; margin-bottom: 15px; font-family: 'Vazirmatn', Tahoma, sans-serif; }
        .btn-back:hover { background-color: #486581; }

        .status-message { margin-top: 20px; padding: 14px; border-radius: 10px; font-weight: bold; display: none; text-align: right; font-size: 13px; }
        .status-success { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .status-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        .report-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; text-align: right; font-family: 'Vazirmatn', Tahoma, sans-serif; }
        .report-table th, .report-table td { border: 1px solid #cbd5e1; padding: 10px; }
        .report-table th { background-color: #f1f5f9; color: #1e293b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- بخش دانش‌آموز -->
        <div id="student-view" class="card">
            <span id="version-display" class="version-badge">v2.6</span>
            <h2>📌 ثبت حضور و غیاب کلاس</h2>
            
            <div id="user-info" class="info-box">
                در حال دریافت اطلاعات کاربر ایتا...
            </div>

            <div style="text-align: right; margin-bottom: 10px;">
                <label for="course-select"><b>انتخاب درس:</b> <small style="color: #e11d48;">*</small></label>
                <select id="course-select">
                    <option value="">-- لطفاً درس را انتخاب کنید --</option>
                    <option value="فرهنگ و هنر">فرهنگ و هنر</option>
                    <option value="آموزش قرآن">آموزش قرآن</option>
                    <option value="پیام‌های آسمان">پیام‌های آسمان</option>
                    <option value="فارسی">فارسی</option>
                    <option value="نگارش (آموزش مهارت‌های نوشتاری)">نگارش (آموزش مهارت‌های نوشتاری)</option>
                    <option value="ریاضی">ریاضی</option>
                    <option value="علوم تجربی">علوم تجربی</option>
                    <option value="مطالعات اجتماعی">مطالعات اجتماعی</option>
                    <option value="تفکر و سبک زندگی">تفکر و سبک زندگی</option>
                    <option value="زبان انگلیسی">زبان انگلیسی</option>
                    <option value="زبان عربی">زبان عربی</option>
                    <option value="کار و فناوری">کار و فناوری</option>
                    <option value="تربیت بدنی و سلامت">تربیت بدنی و سلامت</option>
                </select>
            </div>

            <div style="text-align: right; margin-bottom: 15px;">
                <label for="custom-name"><b>نام و نام خانوادگی دانش‌آموز:</b> <small style="color: #e11d48;">*</small></label>
                <input type="text" id="custom-name" placeholder="مثلاً: علی محمدی">
            </div>

            <button id="attendance-btn" class="btn-attendance" onclick="registerAttendance()">
                ثبت حضور در کلاس
            </button>

            <button class="btn-teacher" onclick="switchToTeacherView()">
                🔐 ورود دبیر (پنل مدیریت)
            </button>

            <div id="status-box" class="status-message"></div>
        </div>

        <!-- بخش پنل دبیر -->
        <div id="teacher-view" class="card" style="display: none;">
            <h2>📊 پنل گزارش‌گیری دبیر</h2>
            
            <button class="btn-back" onclick="switchToStudentView()">
                🔙 بازگشت به صفحه دانش‌آموز
            </button>

            <div style="text-align: right; margin-bottom: 10px;">
                <label for="report-course"><b>انتخاب درس:</b></label>
                <select id="report-course">
                    <option value="">-- همه درس‌ها --</option>
                    <option value="فرهنگ و هنر">فرهنگ و هنر</option>
                    <option value="آموزش قرآن">آموزش قرآن</option>
                    <option value="پیام‌های آسمان">پیام‌های آسمان</option>
                    <option value="فارسی">فارسی</option>
                    <option value="نگارش (آموزش مهارت‌های نوشتاری)">نگارش (آموزش مهارت‌های نوشتاری)</option>
                    <option value="ریاضی">ریاضی</option>
                    <option value="علوم تجربی">علوم تجربی</option>
                    <option value="مطالعات اجتماعی">مطالعات اجتماعی</option>
                    <option value="تفکر و سبک زندگی">تفکر و سبک زندگی</option>
                    <option value="زبان انگلیسی">زبان انگلیسی</option>
                    <option value="زبان عربی">زبان عربی</option>
                    <option value="کار و فناوری">کار و فناوری</option>
                    <option value="تربیت بدنی و سلامت">تربیت بدنی و سلامت</option>
                </select>
            </div>

            <div style="text-align: right; margin-bottom: 15px;">
                <label for="report-date"><b>تاریخ (شمسی):</b></label>
                <input type="text" id="report-date" placeholder="برای انتخاب تقویم کلیک کنید...">
            </div>

            <button class="btn-attendance" style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);" onclick="fetchAttendanceReport()">
                🔍 جستجوی هوشمند بر اساس درس و تاریخ
            </button>

            <button class="btn-all" onclick="fetchAllRecords()">
                📂 نمایش کل رکوردهای ثبت‌شده
            </button>

            <div id="report-result" style="margin-top: 20px; overflow-x: auto;"></div>
        </div>
    </div>

    <script>
        const APP_VERSION = "v2.6";
        document.getElementById('version-display').innerText = APP_VERSION;

        const SUPABASE_URL = 'https://cxnztsdhnndijpyscvvg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6df-9vl0Iraj7Ou0SgnV3g_1_xDneAm';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentEitaaUserId = null;
        let currentEitaaProfileName = '';

        function normalizeDigits(str) {
            if (!str) return '';
            return str.replace(/[۰-۹]/g, d => '0123456789'['۰۱۲۳۴۵۶۷۸۹'.indexOf(d)])
                      .replace(/[0-9]/g, d => '0123456789'[d]);
        }

        function formatTime(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString);
            return date.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        $(document).ready(function() {
            $("#report-date").persianDatepicker({
                format: 'YYYY/MM/DD',
                initialValue: false,
                autoClose: true,
                toolbox: {
                    calendarSwitch: {
                        enabled: false
                    }
                }
            });
        });

        function initEitaaUser() {
            try {
                const wa = window.Eitaa && window.Eitaa.WebApp;
                if (wa) {
                    if (typeof wa.expand === 'function') {
                        wa.expand();
                    }
                    if (wa.initDataUnsafe && wa.initDataUnsafe.user) {
                        const user = wa.initDataUnsafe.user;
                        currentEitaaUserId = user.id;
                        currentEitaaProfileName = [user.first_name, user.last_name].filter(Boolean).join(" ");
                    }
                }
            } catch (e) {
                console.log("خطا در خواندن وب‌اپ ایتا:", e);
            }

            const infoBox = document.getElementById('user-info');
            if (currentEitaaUserId) {
                infoBox.innerHTML = `👤 کاربر ایتا: <b>${currentEitaaProfileName}</b> (آیدی: ${currentEitaaUserId})`;
            } else {
                infoBox.innerHTML = `لطفاً اطلاعات زیر را جهت ثبت حضور وارد کنید`;
            }
        }

        document.addEventListener('DOMContentLoaded', initEitaaUser);

        function getJalaliDate() {
            return new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Tehran' }).format(new Date());
        }

        function switchToTeacherView() {
            document.getElementById('student-view').style.display = 'none';
            document.getElementById('teacher-view').style.display = 'block';
        }

        function switchToStudentView() {
            document.getElementById('teacher-view').style.display = 'none';
            document.getElementById('student-view').style.display = 'block';
        }

        async function registerAttendance() {
            const btn = document.getElementById('attendance-btn');
            const nameInput = document.getElementById('custom-name');
            const courseSelect = document.getElementById('course-select');
            
            const customName = nameInput.value.trim();
            const selectedCourse = courseSelect.value;

            if (!selectedCourse) {
                alert("❌ لطفاً درس مورد نظر را انتخاب کنید!");
                return;
            }

            if (!customName) {
                alert("❌ لطفاً نام و نام خانوادگی خود را وارد کنید!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "در حال ثبت...";

            const jalaliDateStr = getJalaliDate();
            const today = new Date().toISOString().split('T')[0];
            const finalStudentId = currentEitaaUserId ? parseInt(currentEitaaUserId, 10) : Math.floor(Math.random() * 899999) + 100000;

            try {
                await supabaseClient.from('students').upsert({ 
                    id: finalStudentId, 
                    full_name: currentEitaaProfileName || customName
                });

                const { error } = await supabaseClient.from('attendance').insert([
                    { 
                        student_id: finalStudentId, 
                        status_date: today,
                        entered_name: customName,
                        subject: selectedCourse,
                        jalali_date: jalaliDateStr,
                        eitaa_user_id: currentEitaaUserId,
                        eitaa_profile_name: currentEitaaProfileName
                    }
                ]);

                if (error) {
                    showStatus("❌ خطا در ثبت حضور: " + error.message, "error");
                } else {
                    showStatus(`✅ حضور شما در درس <b>${selectedCourse}</b> ثبت شد!<br>👤 نام: ${customName}<br>📅 تاریخ: ${jalaliDateStr}`, "success");
                    nameInfoReset();
                }
            } catch (err) {
                showStatus("❌ خطای غیرمنتظره: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "ثبت حضور در کلاس (مجدد)";
            }
        }

        function nameInfoReset() {
            document.getElementById('custom-name').value = '';
            document.getElementById('course-select').value = '';
        }

        async function fetchAllRecords() {
            const course = document.getElementById('report-course').value;
            const resultDiv = document.getElementById('report-result');
            resultDiv.innerHTML = "در حال بارگذاری همه رکوردها...";

            try {
                let query = supabaseClient.from('attendance').select('*').order('created_at', { ascending: false });
                if (course) {
                    query = query.eq('subject', course);
                }

                const { data, error } = await query;

                if (error) {
                    resultDiv.innerHTML = `<p style="color: red;">خطا: ${error.message}</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    resultDiv.innerHTML = `<p style="color: #666; margin-top: 15px;">رکوردی یافت نشد.</p>`;
                    return;
                }

                displayTable(data, resultDiv);
            } catch (err) {
                resultDiv.innerHTML = `<p style="color: red;">خطا: ${err.message}</p>`;
            }
        }

        async function fetchAttendanceReport() {
            const course = document.getElementById('report-course').value;
            let rawDateStr = document.getElementById('report-date').value.trim();
            const resultDiv = document.getElementById('report-result');

            if (!rawDateStr) {
                alert("لطفاً یک تاریخ از تقویم انتخاب کنید.");
                return;
            }

            resultDiv.innerHTML = "در حال جستجوی هوشمند گزارش...";

            try {
                let query = supabaseClient.from('attendance').select('*').order('created_at', { ascending: false });

                if (course) {
                    query = query.eq('subject', course);
                }

                const { data, error } = await query;

                if (error) {
                    resultDiv.innerHTML = `<p style="color: red;">خطا در دریافت گزارش: ${error.message}</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    resultDiv.innerHTML = `<p style="color: #666; margin-top: 15px;">رکوردی یافت نشد.</p>`;
                    return;
                }

                const normalizedInput = normalizeDigits(rawDateStr);
                const filteredData = data.filter(row => {
                    if (!row.jalali_date) return false;
                    const normalizedRowDate = normalizeDigits(row.jalali_date);
                    return normalizedRowDate.includes(normalizedInput) || normalizedInput.includes(normalizedRowDate);
                });

                if (filteredData.length === 0) {
                    resultDiv.innerHTML = `<p style="color: #666; margin-top: 15px;">رکوردی با تاریخ <b>${rawDateStr}</b> یافت نشد.</p>`;
                    return;
                }

                displayTable(filteredData, resultDiv);

            } catch (err) {
                resultDiv.innerHTML = `<p style="color: red;">خطا: ${err.message}</p>`;
            }
        }

        function displayTable(data, resultDiv) {
            let html = `<p style="font-weight: bold; text-align: right;">تعداد موارد یافت شده: ${data.length}</p>`;
            html += `<table class="report-table">
                        <thead>
                           <tr>
                               <th>ردیف</th>
                               <th>نام دانش‌آموز</th>
                               <th>درس</th>
                               <th>تاریخ ثبت‌شده</th>
                               <th>ساعت ورود</th>
                               <th>پروفایل ایتا</th>
                           </tr>
                        </thead>
                        <tbody>`;

            data.forEach((row, index) => {
                html += `<tr>
                            <td>${index + 1}</td>
                            <td><b>${row.entered_name || 'نامشخص'}</b></td>
                            <td>${row.subject || '-'}</td>
                            <td style="color: #0284c7; font-weight: bold;">${row.jalali_date || '-'}</td>
                            <td style="color: #059669; font-weight: bold; direction: ltr; text-align: right;">${formatTime(row.created_at)}</td>
                            <td>${row.eitaa_profile_name || 'ثبت نشده'}</td>
                         </tr>`;
            });

            html += `</tbody></table>`;
            resultDiv.innerHTML = html;
        }

        function showStatus(message, type) {
            const statusBox = document.getElementById('status-box');
            statusBox.style.display = "block";
            statusBox.className = "status-message " + (type === "success" ? "status-success" : "status-error");
            statusBox.innerHTML = message;
        }
    </script>
</body>
</html>
