<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه حضور و غیاب آنلاین</title>
    <!-- کتابخانه Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; margin: 0; padding: 20px; background-color: #eef2f5; color: #333; }
        .container { max-width: 500px; margin: 30px auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        h2 { margin-top: 0; color: #2c3e50; font-size: 22px; }
        .user-badge { background-color: #e8f4fd; color: #1d6fce; padding: 10px 15px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; display: inline-block; width: 100%; box-sizing: border-box; }
        .btn-attendance { background-color: #27ae60; color: white; border: none; padding: 14px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; }
        .btn-attendance:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .status-message { margin-top: 20px; padding: 12px; border-radius: 8px; font-weight: bold; display: none; }
        .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>📌 ثبت حضور و غیاب کلاس</h2>
            
            <div id="user-info" class="user-badge">در حال دریافت اطلاعات دانش‌آموز...</div>

            <button id="attendance-btn" class="btn-attendance" onclick="registerAttendance()" disabled>
                در حال بررسی وضعیت...
            </button>

            <div id="status-box" class="status-message"></div>
        </div>
    </div>

    <script>
        // تنظیمات Supabase متصل به پروژه شما
        const SUPABASE_URL = 'https://cxnztsdhnndijpyscvvg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6df-9vl0Iraj7Ou0SgnV3g_1_xDneAm';
        
        // تغییر نام متغیر برای جلوگیری از تداخل با کتابخانه
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // دریافت پارامترهای کاربر
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('user_id') || 1001; 
        const studentName = urlParams.get('name') || "دانش‌آموز نمونه";

        document.getElementById('user-info').innerText = `👤 دانش‌آموز: ${studentName} (${studentId})`;

        async function initAttendance() {
            const btn = document.getElementById('attendance-btn');

            try {
                // ثبت یا بروزرسانی دانش‌آموز در جدول اصلی
                await supabaseClient.from('students').upsert({ id: studentId, full_name: studentName });

                // بررسی حضور امروز
                const today = new Date().toISOString().split('T')[0];
                const { data, error } = await supabaseClient
                    .from('attendance')
                    .select('*')
                    .eq('student_id', studentId)
                    .eq('status_date', today);

                if (data && data.length > 0) {
                    btn.disabled = true;
                    btn.innerText = "حضور شما ثبت شده است";
                    showStatus("✅ حضور شما برای امروز قبلاً با موفقیت ثبت شده است.", "success");
                } else {
                    btn.disabled = false;
                    btn.innerText = "ثبت حضور در کلاس";
                }
            } catch (err) {
                console.error("General error:", err);
                btn.disabled = false;
                btn.innerText = "ثبت حضور در کلاس";
            }
        }

        async function registerAttendance() {
            const btn = document.getElementById('attendance-btn');
            btn.disabled = true;
            btn.innerText = "در حال ثبت...";

            const today = new Date().toISOString().split('T')[0];

            try {
                const { data, error } = await supabaseClient.from('attendance').insert([
                    { student_id: studentId, status_date: today }
                ]);

                if (error) {
                    if (error.code === '23505') {
                        showStatus("⚠️ حضور شما برای امروز قبلاً ثبت شده است!", "error");
                        btn.innerText = "حضور شما ثبت شده است";
                    } else {
                        showStatus("❌ خطا در ثبت حضور: " + error.message, "error");
                        btn.disabled = false;
                        btn.innerText = "ثبت حضور در کلاس";
                    }
                } else {
                    btn.innerText = "حضور شما ثبت شد";
                    showStatus("✅ حضور شما با موفقیت ثبت گردید.", "success");
                }
            } catch (err) {
                showStatus("❌ خطای غیرمنتظره: " + err.message, "error");
                btn.disabled = false;
                btn.innerText = "ثبت حضور در کلاس";
            }
        }

        function showStatus(message, type) {
            const statusBox = document.getElementById('status-box');
            statusBox.style.display = "block";
            statusBox.className = "status-message " + (type === "success" ? "status-success" : "status-error");
            statusBox.innerText = message;
        }

        // اجرای تابع بررسی اولیه
        initAttendance();
    </script>
</body>
</html>
